<!-- Google Analytics 4 (GA4) Integration -->
<!-- Replace GA_MEASUREMENT_ID with your actual Google Analytics 4 Measurement ID -->
<script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'GA_MEASUREMENT_ID', {
    // Enhanced ecommerce tracking for Stackdrop Pro subscriptions
    send_page_view: true,
    custom_map: {
      'custom_parameter_1': 'subscription_plan',
      'custom_parameter_2': 'device_count'
    }
  });
  
  // Track installer generation events
  function trackInstallerGeneration(appCount) {
    gtag('event', 'installer_generated', {
      'event_category': 'engagement',
      'event_label': 'apps_selected',
      'value': appCount
    });
  }
  
  // Track Pro subscription events
  function trackProSubscription(plan, price) {
    gtag('event', 'purchase', {
      'transaction_id': Date.now().toString(),
      'value': price,
      'currency': 'USD',
      'items': [{
        'item_id': plan,
        'item_name': 'Stackdrop Pro ' + plan,
        'category': 'Software Subscription',
        'quantity': 1,
        'price': price
      }]
    });
  }
  
  // Track page views with custom parameters
  function trackPageView(pageName, category) {
    gtag('event', 'page_view', {
      'page_title': pageName,
      'page_location': window.location.href,
      'page_category': category
    });
  }
</script>
